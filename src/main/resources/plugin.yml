main: org.zkaleejoo.MaxClans
version: ${project.version}
name: MaxClans
author: ZkAleeJoo
api-version: '1.21'
folia-supported: true

commands:
  maxclans:
    description: Main command for MaxClans
    aliases: [clan, clans, mxc]
  clanchat:
    description: Send a message to your clan chat
    aliases: [c, cc]

permissions:
  maxclans.admin:
    description: Full access to admin commands and notifications.
    default: op
    children:
      maxclans.command.reload: true
      maxclans.spy: true
      maxclans.bypass.warmup: true
      maxclans.bypass.cooldown: true
      maxclans.use: true
  maxclans.use:
    description: Access to all player clan commands and menus.
    default: true
    children:
      maxclans.command.main: true
      maxclans.command.help: true
      maxclans.command.list: true
      maxclans.command.info: true
      maxclans.command.flags: true
      maxclans.command.settings: true
      maxclans.command.create: true
      maxclans.command.disband: true
      maxclans.command.invite: true
      maxclans.command.accept: true
      maxclans.command.deny: true
      maxclans.command.leave: true
      maxclans.command.kick: true
      maxclans.command.promote: true
      maxclans.command.demote: true
      maxclans.command.request: true
      maxclans.command.acceptrequest: true
      maxclans.command.denyrequest: true
      maxclans.command.chat: true
      maxclans.command.top: true
      maxclans.command.tag: true
      maxclans.command.decor: true
      maxclans.command.home: true
      maxclans.command.sethome: true
      maxclans.command.delhome: true
      maxclans.command.homes: true
      maxclans.command.level: true
      maxclans.command.chest: true
      maxclans.command.bank: true
      maxclans.command.ally: true
      maxclans.command.quests: true
  maxclans.command.main:
    description: Open the main clan menu.
    default: true
  maxclans.command.help:
    description: View the clan help command.
    default: true
  maxclans.command.list:
    description: Browse all server clans.
    default: true
  maxclans.command.info:
    description: View clan info and member roster.
    default: true
  maxclans.command.create:
    description: Create a new clan.
    default: true
  maxclans.command.disband:
    description: Disband a clan.
    default: true
  maxclans.command.invite:
    description: Invite players to the clan.
    default: true
  maxclans.command.accept:
    description: Accept clan invitations.
    default: true
  maxclans.command.deny:
    description: Deny clan invitations.
    default: true
  maxclans.command.leave:
    description: Leave current clan.
    default: true
  maxclans.command.kick:
    description: Kick a member from the clan.
    default: true
  maxclans.command.promote:
    description: Promote a clan member.
    default: true
  maxclans.command.demote:
    description: Demote a clan moderator.
    default: true
  maxclans.command.request:
    description: Send a request to join a clan.
    default: true
  maxclans.command.acceptrequest:
    description: Accept join requests.
    default: true
  maxclans.command.denyrequest:
    description: Deny join requests.
    default: true
  maxclans.command.chat:
    description: Use clan chat (/clan chat or /c).
    default: true
  maxclans.command.reload:
    description: Reload the plugin configuration.
    default: op
  maxclans.spy:
    description: Spy on clan chat messages.
    default: op
  maxclans.command.flags:
    description: Access and toggle clan flags.
    default: true
  maxclans.command.settings:
    description: Access clan settings menu.
    default: true
  maxclans.command.top:
    description: Access top clan rankings and leaderboard menu.
    default: true
  maxclans.command.tag:
    description: Change clan tag.
    default: true
  maxclans.command.decor:
    description: Decorate or color clan name.
    default: true
  maxclans.command.home:
    description: Teleport to clan home or base.
    default: true
  maxclans.command.sethome:
    description: Set clan base spawn point.
    default: true
  maxclans.command.delhome:
    description: Delete a clan home or base.
    default: true
  maxclans.command.homes:
    description: List all clan homes.
    default: true
  maxclans.command.level:
    description: View clan level, EXP progress, and unlocked perks.
    default: true
  maxclans.command.chest:
    description: Access the shared clan chest.
    default: true
  maxclans.command.bank:
    description: Access the clan bank.
    default: true
  maxclans.command.ally:
    description: Manage clan alliances.
    default: true
  maxclans.command.quests:
    description: View daily clan missions and progress.
    default: true
  maxclans.bypass.warmup:
    description: Bypass clan teleport warmup delay.
    default: op
  maxclans.bypass.cooldown:
    description: Bypass clan teleport cooldown.
    default: op
