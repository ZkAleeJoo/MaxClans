main: org.zkaleejoo.OnlyClans
version: ${project.version}
name: OnlyClans
author: ZkAleeJoo
api-version: '1.21'
folia-supported: true

commands:
  onlyclans:
    description: Main command for OnlyClans
    aliases: [clan, clans, olc]
  clanchat:
    description: Send a message to your clan chat
    aliases: [c, cc]

permissions:
  onlyclans.admin:
    description: Full access to admin commands and notifications.
    default: op
    children:
      onlyclans.command.reload: true
      onlyclans.spy: true
      onlyclans.bypass.warmup: true
      onlyclans.bypass.cooldown: true
      onlyclans.use: true
  onlyclans.use:
    description: Access to all player clan commands and menus.
    default: true
    children:
      onlyclans.command.main: true
      onlyclans.command.help: true
      onlyclans.command.list: true
      onlyclans.command.info: true
      onlyclans.command.flags: true
      onlyclans.command.settings: true
      onlyclans.command.create: true
      onlyclans.command.disband: true
      onlyclans.command.invite: true
      onlyclans.command.accept: true
      onlyclans.command.deny: true
      onlyclans.command.leave: true
      onlyclans.command.kick: true
      onlyclans.command.promote: true
      onlyclans.command.demote: true
      onlyclans.command.request: true
      onlyclans.command.acceptrequest: true
      onlyclans.command.denyrequest: true
      onlyclans.command.chat: true
      onlyclans.command.top: true
      onlyclans.command.tag: true
      onlyclans.command.decor: true
      onlyclans.command.home: true
      onlyclans.command.sethome: true
      onlyclans.command.delhome: true
      onlyclans.command.homes: true
  onlyclans.command.main:
    description: Open the main clan menu.
    default: true
  onlyclans.command.help:
    description: View the clan help command.
    default: true
  onlyclans.command.list:
    description: Browse all server clans.
    default: true
  onlyclans.command.info:
    description: View clan info and member roster.
    default: true
  onlyclans.command.create:
    description: Create a new clan.
    default: true
  onlyclans.command.disband:
    description: Disband a clan.
    default: true
  onlyclans.command.invite:
    description: Invite players to the clan.
    default: true
  onlyclans.command.accept:
    description: Accept clan invitations.
    default: true
  onlyclans.command.deny:
    description: Deny clan invitations.
    default: true
  onlyclans.command.leave:
    description: Leave current clan.
    default: true
  onlyclans.command.kick:
    description: Kick a member from the clan.
    default: true
  onlyclans.command.promote:
    description: Promote a clan member.
    default: true
  onlyclans.command.demote:
    description: Demote a clan moderator.
    default: true
  onlyclans.command.request:
    description: Send a request to join a clan.
    default: true
  onlyclans.command.acceptrequest:
    description: Accept join requests.
    default: true
  onlyclans.command.denyrequest:
    description: Deny join requests.
    default: true
  onlyclans.command.chat:
    description: Use clan chat (/clan chat or /c).
    default: true
  onlyclans.command.reload:
    description: Reload the plugin configuration.
    default: op
  onlyclans.spy:
    description: Spy on clan chat messages.
    default: op
  onlyclans.command.flags:
    description: Access and toggle clan flags.
    default: true
  onlyclans.command.settings:
    description: Access clan settings menu.
    default: true
  onlyclans.command.top:
    description: Access top clan rankings and leaderboard menu.
    default: true
  onlyclans.command.tag:
    description: Change clan tag.
    default: true
  onlyclans.command.decor:
    description: Decorate or color clan name.
    default: true
  onlyclans.command.home:
    description: Teleport to clan home or base.
    default: true
  onlyclans.command.sethome:
    description: Set clan base spawn point.
    default: true
  onlyclans.command.delhome:
    description: Delete a clan home or base.
    default: true
  onlyclans.command.homes:
    description: List all clan homes.
    default: true
  onlyclans.bypass.warmup:
    description: Bypass clan teleport warmup delay.
    default: op
  onlyclans.bypass.cooldown:
    description: Bypass clan teleport cooldown.
    default: op

