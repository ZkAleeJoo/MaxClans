# ==================================================================== #
#                      OnlyClans - Main Configuration                  #
# ==================================================================== #
# Formatting Support across the entire plugin:
#   - MiniMessage: <red>, <bold>, <gradient:#color1:#color2>text</gradient>, <rainbow>text</rainbow>
#   - Interactive: <click:run_command:/cmd>, <hover:show_text:'tooltip'>
#   - Legacy & Hex: &a, &c, &l, &r, &#2F6AFA, &x&1&2&3&4&5&6, § codes
# ==================================================================== #

general:
  # Plugin prefix (supports MiniMessage, Gradients, and Legacy)
  prefix: '&#2F6AFA&lOnlyClans &8» '
  # Plugin language (options: 'en', 'es', or any custom messages_<lang>.yml)
  language: 'en'
  update-check: true
  bstats: true

database:
  # Type: 'sqlite' or 'mysql'
  type: 'sqlite'
  # MySQL settings (only used if type is 'mysql')
  host: 'localhost'
  port: 3306
  name: 'onlyclans'
  username: 'root'
  password: ''

# ==================================================================== #
#                      Placeholder Configuration                       #
# ==================================================================== #
# Configure all internal placeholders and PlaceholderAPI placeholders.
# Placeholders adapt automatically according to 'general.language'.
# You can also explicitly request a specific language placeholder:
#   %onlyclans_role_formatted_en%, %onlyclans_role_formatted_es%
#   %onlyclans_ff_badge_en%, %onlyclans_ff_badge_es%
#   %onlyclans_ff_status_en%, %onlyclans_ff_status_es%
# ==================================================================== #
placeholders:
  # Date formatting pattern (e.g. dd/MM/yyyy or MM/dd/yyyy)
  date-format: 'dd/MM/yyyy'
  # Tag formatting template ({tag} is replaced with the clan tag)
  tag-format: '[{tag}<dark_gray>]</dark_gray>'
  # Multi-language text settings
  languages:
    en:
      none: 'None'
      no-clan-tag: '---'
      unknown: 'Unknown'
      not-in-clan: 'None'
      roles:
        leader: 'Leader'
        moderator: 'Moderator'
        member: 'Member'
        none: 'None'
      roles-formatted:
        leader: '&#FFD700★ Leader'
        moderator: '&#00E5FF◆ Moderator'
        member: '&#A0AEC0● Member'
        none: '&#718096None'
      friendly-fire:
        on: 'ON'
        off: 'OFF'
        badge-enabled: '&#00FF88&lENABLED'
        badge-disabled: '&#FF3366&lDISABLED'
        status-enabled: '&#00FF88✔ Enabled'
        status-disabled: '&#FF3366✖ Disabled'
      flags:
        badge-enabled: '&#00FF88&lENABLED'
        badge-disabled: '&#FF3366&lDISABLED'
        status-enabled: '&#00FF88✔ Enabled'
        status-disabled: '&#FF3366✖ Disabled'
      gui:
        status-online: '&#00FF88● Online'
        status-offline: '&#FF3366○ Offline'
        status-label: '&#A0AEC0Status: '
        role-label: '&#A0AEC0Role: '
        kdr-label: '&#A0AEC0KDR: '
        playtime-label: '&#A0AEC0Playtime: '
