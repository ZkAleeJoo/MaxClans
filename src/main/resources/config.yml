# ==================================================================== #
#                      Placeholder Configuration                       #
# ==================================================================== #
# Configure all internal placeholders and PlaceholderAPI placeholders.
# Placeholders adapt automatically according to 'general.language'.
# You can also explicitly request a specific language placeholder:
#   %maxclans_role_formatted_en%, %maxclans_role_formatted_es%
#   %maxclans_ff_badge_en%, %maxclans_ff_badge_es%
#   %maxclans_ff_status_en%, %maxclans_ff_status_es%
# ==================================================================== #
placeholders:
  # Output format for PlaceholderAPI:
  #   'minimessage' - Returns Adventure MiniMessage tags (<color>, <bold>, etc.).
  #                   REQUIRED for LPC, modern chat plugins, Paper/Folia chat.
  #   'legacy'      - Returns Spigot legacy color codes (§a, §x§1§2§3§4§5§6).
  #                   Use this if your scoreboards/tab plugins only support legacy § colors.
  # Note: You can also explicitly request either format by adding _mm or _legacy
  # to any placeholder (e.g. %maxclans_tag_mm% or %maxclans_tag_legacy%).
  format-mode: 'minimessage'
  # Date formatting pattern (e.g. dd/MM/yyyy or MM/dd/yyyy)
  date-format: 'dd/MM/yyyy'
  # Tag formatting template ({tag} is replaced with the clan tag)
  tag-format: '<dark_gray>[</dark_gray>{tag}<dark_gray>]</dark_gray>'
  # Multi-language text settings
  languages:
    en:
      none: 'None'
      no-clan-tag: '---'
      unknown: 'Unknown'
      not-in-clan: 'None'
      roles:
        leader: 'Leader'
        moderator: 'Moderator'
        member: 'Member'
        none: 'None'
