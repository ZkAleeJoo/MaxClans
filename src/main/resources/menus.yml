# ====================================================================#
#                     OnlyClans - Menus Configuration               #
# ====================================================================#
# Formatting Support (titles, item names, and lore):
#   - MiniMessage: <red>, <bold>, <gradient:#color1:#color2>text</gradient>, <rainbow>text</rainbow>
#   - Legacy & Hex: &a, &c, &l, &r, &#2F6AFA, &x&1&2&3&4&5&6, § codes
#
# Available Placeholders:
#   %player%              - Player name
#   %clan_name%           - Clan name (or 'None')
#   %clan_tag%            - Clan tag (or '---')
#   %clan_members%        - Total member count
#   %clan_members_online% - Currently online members
#   %clan_leader%         - Clan leader name
#   %clan_role%           - Formatted player role
#   %clan_ff%             - Friendly Fire status (✔ Enabled / ✖ Disabled)
#   %clan_ff_badge%       - Friendly Fire badge (ENABLED / DISABLED)
#   %clan_created%        - Clan creation date
#   %total_clans%         - Total number of registered clans
#   %page%                - Current page number
#   %max_pages%           - Total page count
#
# Available Actions:
#   open:<menu_id>        - Opens another menu (e.g.: open:create, open:info, open:clan_list)
#   action:create_clan    - Starts clan creation (chat input prompt)
#   action:toggle_ff      - Toggles Friendly Fire
#   action:disband        - Opens clan disband confirmation menu
#   action:confirm_disband- Permanently disbands the clan
#   action:leave          - Leaves the current clan
#   action:clan_page_prev - Goes to previous page in clan list
#   action:clan_page_next - Goes to next page in clan list
#   command:<command>     - Executes a command as the player
#   close                 - Closes the menu
# ====================================================================#

